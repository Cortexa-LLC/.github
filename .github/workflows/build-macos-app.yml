# Reusable workflow — build, (optionally) notarize, and publish a macOS app DMG.
#
# Caller triggers:
#   - push / workflow_dispatch    → builds DMG, uploads as Actions artifact
#   - tag push (v*.*.*)           → builds DMG, notarizes, creates GitHub Release
#
# Requirements on the self-hosted runner (harvana-m2max):
#   - Xcode + command-line tools installed
#   - Developer ID Application certificate in the login keychain
#   - Homebrew at /opt/homebrew
#   - Notarytool keychain profile stored once per app:
#       xcrun notarytool store-credentials "<notarytool-profile>" \
#           --apple-id "you@example.com" --team-id "TEAMID" \
#           --password "<app-specific-password>"

name: Build macOS App

on:
  workflow_call:
    inputs:
      app-name:
        description: "App bundle name without .app (e.g. ADSync)"
        required: true
        type: string
      scheme:
        description: "Xcode scheme to build"
        required: true
        type: string
      build-script:
        description: "Repo-relative path to the build/package script"
        required: false
        type: string
        default: "scripts/build-dmg.sh"
      use-xcodegen:
        description: "Run xcodegen generate before building"
        required: false
        type: boolean
        default: false
      xcodegen-spec:
        description: "Path to the xcodegen spec file"
        required: false
        type: string
        default: "project.yml"
      notarytool-profile:
        description: "Keychain profile name for xcrun notarytool"
        required: false
        type: string
        default: ""
      artifact-glob:
        description: "Glob (relative to repo root) to collect as the release asset"
        required: false
        type: string
        default: "build/*.dmg"
      releases-repo:
        description: "Repo to publish GitHub Releases to (e.g. Cortexa-LLC/ADSync-releases). Defaults to the calling repo."
        required: false
        type: string
        default: ""
      retention-days:
        description: "Days to retain non-release artifacts"
        required: false
        type: number
        default: 14
      runner:
        description: "runs-on value as a JSON array string, e.g. '[\"self-hosted\",\"macos\",\"arm64\",\"harvana-m2max\"]'"
        required: false
        type: string
        default: '["self-hosted", "macos", "arm64", "harvana-m2max"]'
      signing-script:
        description: "Repo-relative signing wrapper (Infisical → ephemeral keychain). When set, the build runs wrapped by it and no login-keychain identity is needed."
        required: false
        type: string
        default: ""
      infisical-project-id:
        description: "Infisical workspace id holding the signing secrets (config, not a secret)"
        required: false
        type: string
        default: ""
      infisical-api:
        description: "Infisical API base URL"
        required: false
        type: string
        default: "https://infisical.cortexa.com"

jobs:
  build:
    name: Build ${{ inputs.app-name }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30

    steps:
      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history for git rev-list --count (build number)

      - name: Compute metadata
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "is_tag=${{ startsWith(github.ref, 'refs/tags/') }}" >> $GITHUB_OUTPUT
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Install Homebrew dependencies
        run: |
          brew install create-dmg ${{ inputs.use-xcodegen && 'xcodegen' || '' }} 2>/dev/null || true

      - name: Generate Xcode project
        if: inputs.use-xcodegen
        run: xcodegen generate --spec "${{ inputs.xcodegen-spec }}"

      - name: Build ${{ inputs.app-name }}
        id: build
        env:
          NOTARIZE: ${{ steps.meta.outputs.is_tag == 'true' && (inputs.signing-script != '' || inputs.notarytool-profile != '') }}
          # Signing via Infisical (used when signing-script is set — no login-keychain
          # identity or stored notarytool profile required).
          INFISICAL_API: ${{ inputs.infisical-api }}
          INFISICAL_PROJECT_ID: ${{ inputs.infisical-project-id }}
          INFISICAL_CLIENT_ID: ${{ secrets.APPLE_SIGNING_INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.APPLE_SIGNING_INFISICAL_CLIENT_SECRET }}
          # Legacy fallback: identity in the login keychain + stored notarytool profile.
          KEYCHAIN_PROFILE: ${{ inputs.notarytool-profile }}
        run: |
          ARGS=""
          [[ "$NOTARIZE" == "true" ]] && ARGS="--notarize"
          if [[ -n "${{ inputs.signing-script }}" ]]; then
            # signing-script fetches the Developer ID from Infisical into an ephemeral
            # keychain, runs the build wrapped, then tears the keychain down.
            python3 "${{ inputs.signing-script }}" run -- python3 "${{ inputs.build-script }}" $ARGS
          else
            bash "${{ inputs.build-script }}" $ARGS
          fi

      - name: Locate DMG
        id: dmg
        run: |
          DMG=$(ls ${{ inputs.artifact-glob }} 2>/dev/null | head -1)
          if [[ -z "$DMG" ]]; then
            echo "✗ No artifact matched: ${{ inputs.artifact-glob }}"
            exit 1
          fi
          echo "path=${DMG}" >> $GITHUB_OUTPUT
          echo "name=$(basename ${DMG})" >> $GITHUB_OUTPUT

      # ── Non-release: upload as Actions artifact ──────────────────────────
      - name: Upload artifact
        if: steps.meta.outputs.is_tag != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app-name }}-${{ steps.meta.outputs.short_sha }}
          path: ${{ steps.dmg.outputs.path }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      # ── Tag release: create GitHub Release with DMG attached ─────────────
      # Publishes to releases-repo if set, otherwise to the calling repo.
      - name: Create GitHub Release
        if: steps.meta.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          DMG: ${{ steps.dmg.outputs.path }}
          APP: ${{ inputs.app-name }}
          TARGET_REPO: ${{ inputs.releases-repo != '' && inputs.releases-repo || github.repository }}
        run: |
          gh release create "$TAG" "$DMG" \
            --repo "$TARGET_REPO" \
            --title "$APP $TAG" \
            --generate-notes \
            --verify-tag
